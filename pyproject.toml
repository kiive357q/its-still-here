[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "its-still-here"
version = "0.1.0"
description = "Automated file transfer relay — detects files from sources and uploads them to remote storage."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "watchdog>=4.0",
    "httpx[socks]>=0.27",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
wechat = ["wxauto>=3.9.0"]
dev    = ["pytest>=8.0"]

[project.scripts]
its-still-here = "its_still_here.cli:app"
